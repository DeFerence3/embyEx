name: Build and release Android and desktop

env:
  ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
  STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

# Do not cancel a run while its release assets are being uploaded.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: App version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      # Empty when not run from a tag; Gradle then falls back to the version catalog.
      gradle-args: ${{ steps.parse.outputs.gradle-args }}
      # "true" for vMAJOR.MINOR.PATCH-beta.N tags.
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse version from tag
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Not a tag build; using the version from gradle/libs.versions.toml"
            echo "gradle-args=" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-beta\.([1-9][0-9]?))?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not in the form vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-beta.N (N = 1-99)"
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}${BASH_REMATCH[4]}"
          prerelease=false
          [[ -n "${BASH_REMATCH[4]}" ]] && prerelease=true
          echo "App version: $version (pre-release: $prerelease)"
          echo "gradle-args=-PappVersion=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - name: Restore Android signing key
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/android-release.jks"

      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-release.jks
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease -PrequireAndroidSigning=true ${{ needs.version.outputs.gradle-args }} --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-android
          path: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error
          retention-days: 5

      - name: Remove Android signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/android-release.jks"

  desktop:
    name: Desktop - Windows
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # jpackage builds the MSI; the Compose plugin downloads WiX itself.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build Windows MSI
        shell: pwsh
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GRADLE_VERSION_ARGS: ${{ needs.version.outputs.gradle-args }}
        # Also writes latest-windows.yml and the generic latest.yml for the in-app updater.
        # PowerShell splits a bare -PappVersion=1.4.0 at the first dot, so the argument is
        # passed from a variable, which PowerShell hands over as one argument.
        run: |
          $gradleArgs = @(':desktopApp:generateUpdateMetadata', '--no-daemon', '--no-configuration-cache', '--stacktrace')
          if ($env:GRADLE_VERSION_ARGS) { $gradleArgs += $env:GRADLE_VERSION_ARGS }
          ./gradlew.bat @gradleArgs

      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: |
            desktopApp/build/compose/binaries/main/msi/*.msi
            desktopApp/build/compose/binaries/main/update-metadata/latest-windows.yml
            desktopApp/build/compose/binaries/main/update-metadata/latest.yml
          if-no-files-found: error
          retention-days: 5

  desktop-linux:
    name: Desktop - Linux
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # jpackage builds the .deb; :player compiles its libmpv bridge with the runner's c++.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build Linux deb and app image
        # :androidApp is configured too, and its signing config needs a keystore path (never read here).
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/android-release.jks
        # Also writes latest-linux.yml for the in-app updater. The app image feeds the Arch package.
        run: |
          chmod +x gradlew
          ./gradlew :desktopApp:generateUpdateMetadata :desktopApp:createDistributable ${{ needs.version.outputs.gradle-args }} --no-daemon --no-configuration-cache --stacktrace

      - name: Pack app image for the Arch package
        run: |
          set -euo pipefail
          mkdir -p arch-input
          tar -C desktopApp/build/compose/binaries/main/app -czf arch-input/embyex-app-image.tar.gz embyEx
          sed -n 's/^version: //p' desktopApp/build/compose/binaries/main/update-metadata/latest-linux.yml > arch-input/version.txt
          echo "App version: $(cat arch-input/version.txt)"

      # Not a release asset: only handed to the Arch job.
      - name: Upload app image
        uses: actions/upload-artifact@v4
        with:
          name: linux-app-image
          path: arch-input/
          if-no-files-found: error
          retention-days: 1

      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-linux
          path: |
            desktopApp/build/compose/binaries/main/deb/*.deb
            desktopApp/build/compose/binaries/main/update-metadata/latest-linux.yml
          if-no-files-found: error
          retention-days: 5

  desktop-arch:
    name: Desktop - Arch Linux
    needs: desktop-linux
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Download app image
        uses: actions/download-artifact@v8
        with:
          name: linux-app-image
          path: desktopApp/packaging/arch

      - name: Build Arch package
        # makepkg refuses to run as root. --nodeps: package() only copies files, so the
        # runtime dependencies need not be installed in the container.
        run: |
          set -euo pipefail
          cd desktopApp/packaging/arch
          version=$(cat version.txt)
          useradd --create-home builder
          chown -R builder .
          su builder -c "EMBYEX_VERSION='$version' makepkg --nodeps --noconfirm"

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-arch
          path: desktopApp/packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 5

  generate-changelog:
    name: Changelog
    # Only run if the workflow was triggered by a tag push
    # Which is the only time a release is published, hence changelog needed
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.PAT }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Changelog
        shell: bash
        run: |
          CURRENT_TAG="$GITHUB_REF_NAME"
          # Newest first, with each -beta.N ordered before its release. A release's notes cover
          # everything since the previous release (its betas included); a beta's, since the previous tag.
          TAGS=$(git -c versionsort.suffix=-beta tag --sort=-v:refname)
          if [[ "$CURRENT_TAG" != *-beta.* ]]; then
            TAGS=$(grep -v -e '-beta\.' <<< "$TAGS" || true)
          fi
          PREVIOUS_TAG=$(grep -x -F -A1 -- "$CURRENT_TAG" <<< "$TAGS" | sed -n '2p')
          BRANCH="master"

          # 1. Get exact timestamps for the tag window
          START_DATE=$(git log -1 --format=%cI "$PREVIOUS_TAG")
          END_DATE=$(git log -1 --format=%cI "$CURRENT_TAG")
          DATE_FILTER="merged:${START_DATE}..${END_DATE}"

          # 2. Get the PRs merged in this timeframe. The date window is inclusive and second-granular,
          #    so keep only PRs whose merge commit is actually part of the tag range.
          RANGE_COMMITS=$(git rev-list "$PREVIOUS_TAG..$CURRENT_TAG")
          PR_LINES=$(gh pr list --state merged --base "$BRANCH" --search "$DATE_FILTER" --limit 100 --json title,author,number,mergeCommit \
            --jq '.[] | select(.mergeCommit != null) | "\(.mergeCommit.oid)\t* \(.title) by @\(.author.login) in #\(.number) (\(.mergeCommit.oid[0:7]))"' \
            | RANGE_COMMITS="$RANGE_COMMITS" awk '
                BEGIN { n = split(ENVIRON["RANGE_COMMITS"], shas, "\n"); for (i = 1; i <= n; i++) if (shas[i] != "") keep[shas[i]] = 1 }
                NF { tab = index($0, "\t"); if (substr($0, 1, tab - 1) in keep) print }
              ')
          PR_COMMITS=$(cut -f1 <<< "$PR_LINES")

          # 3. Print the PRs
          echo "## 🚀What's Changed" > release_notes.md

          ### Pull Requests
          if [[ -n "$PR_LINES" ]]; then
            cut -f2- <<< "$PR_LINES" >> release_notes.md
          fi

          # 4. Print the raw commits (excluding the PR merge commits, already listed above)
          ### Commits
          # Filter exact SHAs: `git log ^<sha>` would also hide every ancestor of a squash-merged PR.
          # --first-parent keeps commits from merge-style PR branches out of the list.
          git log "$PREVIOUS_TAG..$CURRENT_TAG" --first-parent --pretty=format:'%H%x09* %s by %an (%h)%n' \
            | PR_COMMITS="$PR_COMMITS" awk '
                BEGIN { n = split(ENVIRON["PR_COMMITS"], prs, "\n"); for (i = 1; i <= n; i++) if (prs[i] != "") skip[prs[i]] = 1 }
                NF { tab = index($0, "\t"); if (!(substr($0, 1, tab - 1) in skip)) print substr($0, tab + 1) }
              ' >> release_notes.md

          REPO="${{ github.repository }}"

          echo "" >> release_notes.md
          echo "" >> release_notes.md

          # Append the Full Changelog Range Link
          if [ -n "$PREVIOUS_TAG" ]; then
          echo "**Full Changelog**: https://github.com/$REPO/compare/${PREVIOUS_TAG}...${CURRENT_TAG}" >> release_notes.md
          else
          echo "**Full Changelog**: https://github.com/$REPO/${CURRENT_TAG}" >> release_notes.md
          fi
      - name: Upload changelog
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-changelog
          path: release_notes.md
          retention-days: 5


  release:
    name: Publish GitHub Release
    needs: [ version, android, desktop, desktop-linux, desktop-arch, generate-changelog ]
    # Only run if the workflow was triggered by a tag push
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.PAT }}
          # upload-artifact keeps paths relative to the files' common parent (msi/, deb/, update-metadata/).
          files: release-assets/**/*
          body_path: release-assets/release_notes.md
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}

      - name: Prune old beta releases
        # Keep only the newest beta releases. Git tags are kept so changelog ranges and
        # compare links between remaining releases stay valid.
        if: needs.version.outputs.prerelease == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PAT }}
          KEEP_BETAS: 7
        run: |
          set -euo pipefail
          STALE_TAGS=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --exclude-drafts \
            --limit 1000 \
            --json tagName,isPrerelease,createdAt \
            --jq "[.[] | select(.isPrerelease and (.tagName | test(\"-beta\\\\.[0-9]+$\")))]
                  | sort_by(.createdAt) | reverse | .[$KEEP_BETAS:] | .[].tagName")

          if [[ -z "$STALE_TAGS" ]]; then
            echo "No beta releases beyond the newest $KEEP_BETAS."
            exit 0
          fi

          while IFS= read -r tag; do
            echo "Deleting beta release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done <<< "$STALE_TAGS"
