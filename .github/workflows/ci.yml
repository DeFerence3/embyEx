name: CI

# Pull request checks for dev and master (see docs/release-workflow.md). Branch rulesets require
# only the "CI passed" job, which fails unless every other job succeeded.

on:
  pull_request:
    branches: [ dev, master ]
  push:
    branches: [ dev, master ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR or branch supersedes the running checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # :androidApp's signing config needs a keystore path at configuration time. Only the path is set,
  # so builds stay unsigned and the file is never read.
  ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/unused-android-release.jks
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  checks:
    name: Tests and lint (Android + JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      # Also validates the Gradle wrapper checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      # Common, JVM, and Android host tests, desktop tests, and Android lint for every module.
      # Explicit tasks rather than `check`, which also compiles the iOS targets; iOS is not supported
      # for now, so CI neither builds, tests, nor lints it.
      - name: Run tests and lint
        run: |
          chmod +x gradlew
          ./gradlew \
            :shared:jvmTest :shared:testAndroidHostTest :shared:lint \
            :player:jvmTest :player:testAndroidHostTest :player:lint \
            :coreui:jvmTest :coreui:testAndroidHostTest :coreui:lint \
            :androidApp:testDebugUnitTest :androidApp:lint \
            :desktopApp:test \
            --continue --stacktrace

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-checks
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  android:
    name: Android release build (unsigned)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :androidApp:assembleRelease --stacktrace

  desktop:
    name: Desktop build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # Builds the per-OS libmpv bridge and the runnable app image, without the installer step.
      - name: Build desktop app
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :desktopApp:test :desktopApp:createDistributable --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports-desktop-${{ matrix.os }}
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: ignore
          retention-days: 7

  ci-passed:
    name: CI passed
    if: always()
    needs: [ workflows, checks, android, desktop ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to succeed
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A required CI job did not succeed ($result)."
              exit 1
            fi
          done
